name: Render and queue the daily reel

# The daily reel task pushes plans/daily/<date>.json (with voice lines and post.caption). This narrates it with
# the free Kokoro voice model, mixes the newsroom sound library, renders, and queues the reel in FiveBeforeMonday
# (reels/<date>.mp4 + .json), where post-reel.yml publishes it to Instagram at 6:31pm New York time.
# Pull requests that touch the sound or render code render tests/sound-test.json instead (nothing is queued).
on:
  push:
    branches: [main]
    paths: ["plans/daily/*.json"]
  pull_request:
    paths: ["scripts/**", "src/**", "public/sfx/lib/**", ".github/workflows/render-reel.yml"]
  workflow_dispatch:
    inputs:
      plan:
        description: "Plan to render, e.g. plans/daily/2026-11-13.json"
        required: true
      queue:
        description: "Queue it for Instagram"
        type: boolean
        default: true

permissions:
  contents: write

concurrency: render-reel

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ vars.VOICE_ENGINE || 'kokoro' }}-v1
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng fluidsynth fluid-soundfont-gm
          if [ "${{ vars.VOICE_ENGINE }}" = chatterbox ]; then
            pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
            pip install --quiet chatterbox-tts numpy soundfile mido
          else
            pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
            pip install --quiet numpy soundfile mido "kokoro>=0.9"
          fi
          npm ci

      - name: Which plan
        id: plan
        env:
          INPUT: ${{ inputs.plan }}
        run: |
          PLAN="$INPUT"
          if [ "${{ github.event_name }}" = "pull_request" ]; then PLAN=tests/sound-test.json; fi
          if [ -z "$PLAN" ]; then PLAN=$(git diff --name-only HEAD~1 HEAD -- 'plans/daily/*.json' | tail -1); fi
          [ -n "$PLAN" ] || { echo "No daily plan in this push."; exit 1; }
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"
          echo "date=$(basename "$PLAN" .json)" >> "$GITHUB_OUTPUT"
          echo "id=$(node -e "console.log(require('./$PLAN').id)")" >> "$GITHUB_OUTPUT"

      - name: Narrate and render
        env:
          VOICE_ENGINE: ${{ vars.VOICE_ENGINE || 'kokoro' }}
          VOICE_NAME: ${{ vars.VOICE_NAME || 'bm_george' }}
          VOICE_EXAGGERATION: ${{ vars.VOICE_EXAGGERATION || '0.5' }}
          VOICE_CFG: ${{ vars.VOICE_CFG || '0.5' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          [ -f public/sfx/lib/sting.wav ] || python3 scripts/sfxsynth.py
          scripts/make.sh "${{ steps.plan.outputs.plan }}"
          test -s "out/${{ steps.plan.outputs.id }}/vo.json" || { echo "No narration was produced."; exit 1; }
          ffmpeg -v error -y -i "out/${{ steps.plan.outputs.id }}.mp4" -c:v libx264 -preset veryfast -crf 24 \
            -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart "out/reel.mp4"
          ls -la out/reel.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: reel-${{ steps.plan.outputs.date }}
          path: |
            out/reel.mp4
            out/${{ steps.plan.outputs.id }}-sheet.png

      - name: Queue for Instagram
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.queue)
        env:
          TOKEN: ${{ secrets.FBM_PUSH_TOKEN }}
          PLAN: ${{ steps.plan.outputs.plan }}
          DATE: ${{ steps.plan.outputs.date }}
        run: |
          if [ -z "$TOKEN" ]; then echo "FBM_PUSH_TOKEN is not set; the video is in this run's artifacts."; exit 1; fi
          git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/JiwooYang96/FiveBeforeMonday.git" fbm
          mkdir -p fbm/reels
          cp out/reel.mp4 "fbm/reels/$DATE.mp4"
          node -e '
            const p = require("./" + process.env.PLAN);
            const caption = (p.post && p.post.caption) || p.title || "";
            const out = {video: `reels/${process.env.DATE}.mp4`, caption, posted: null};
            require("fs").writeFileSync(`fbm/reels/${process.env.DATE}.json`, JSON.stringify(out, null, 2) + "\n");'
          cd fbm
          git config user.name "five-before-monday-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reels
          git commit -m "Queue reel $DATE"
          git push
          echo "Queued reels/$DATE.mp4 for 6:31pm New York." >> "$GITHUB_STEP_SUMMARY"
