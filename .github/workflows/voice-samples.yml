name: Voice samples

# Renders the same short script with each candidate voice and pushes the MP3s to the `samples` branch
# (samples/voices/), so the voice can be picked by ear.
on:
  workflow_dispatch:
  push:
    branches: [endcard]
    paths: ["scripts/voicesamples.py", ".github/workflows/voice-samples.yml"]

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Kokoro voices
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m venv /tmp/k && . /tmp/k/bin/activate
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet numpy soundfile "kokoro>=0.9"
          python scripts/voicesamples.py kokoro /tmp/samples
      - name: Chatterbox voices
        continue-on-error: true
        run: |
          python -m venv /tmp/c && . /tmp/c/bin/activate
          pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet chatterbox-tts soundfile
          python scripts/voicesamples.py chatterbox /tmp/samples
      - name: Push to the samples branch
        run: |
          mkdir -p /tmp/mp3
          for f in /tmp/samples/*.wav; do ffmpeg -v error -y -i "$f" -b:a 128k "/tmp/mp3/$(basename "$f" .wav).mp3"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin samples || true
          git checkout -B samples
          git rm -rq --cached . && rm -rf ./* .github
          mkdir -p samples/voices && cp /tmp/mp3/*.mp3 samples/voices/
          git add samples && git commit -qm "Voice samples" && git push -f origin samples
